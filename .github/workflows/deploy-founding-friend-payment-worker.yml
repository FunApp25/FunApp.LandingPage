name: Deploy Founding Friend Payment Worker

on:
  workflow_dispatch:
    inputs:
      authorize_payment_creation:
        description: Authorize live Checkout creation for this deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: founding-friend-payment-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Validate and deploy payment Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cloudflare/founding-friend-payment-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Wrangler configuration
        run: npm run wrangler:validate

      - name: Preflight and deploy payment Worker
        shell: bash
        env:
          PAYMENT_CREATION_ENABLED: ${{ vars.PAYMENT_CREATION_ENABLED || 'false' }}
          AUTHORIZE_PAYMENT_CREATION: ${{ inputs.authorize_payment_creation }}
          STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
          STRIPE_EXPECTED_LIVEMODE: ${{ vars.STRIPE_EXPECTED_LIVEMODE }}
          STRIPE_AUTOMATIC_TAX_ENABLED: ${{ vars.STRIPE_AUTOMATIC_TAX_ENABLED }}
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PURCHASE_REFERENCE_SECRET: ${{ secrets.PURCHASE_REFERENCE_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node ../../tool/check_production_worker.mjs founding-friend-payment-worker
          umask 077
          secrets_file=$(mktemp "$RUNNER_TEMP/production-payment-secrets.XXXXXX")
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            const { STRIPE_SECRET_KEY, PURCHASE_REFERENCE_SECRET } = process.env;
            process.stdout.write(JSON.stringify({ STRIPE_SECRET_KEY, PURCHASE_REFERENCE_SECRET }));
          ' > "$secrets_file"
          unset STRIPE_SECRET_KEY PURCHASE_REFERENCE_SECRET
          npx --no-install wrangler deploy --env="" --config wrangler.jsonc \
            --secrets-file "$secrets_file" \
            --var "PAYMENT_CREATION_ENABLED:$PAYMENT_CREATION_ENABLED" \
            --var "STRIPE_PRICE_ID:$STRIPE_PRICE_ID" \
            --var "STRIPE_EXPECTED_LIVEMODE:$STRIPE_EXPECTED_LIVEMODE" \
            --var "STRIPE_AUTOMATIC_TAX_ENABLED:$STRIPE_AUTOMATIC_TAX_ENABLED" \
            --var "PUBLIC_APP_ORIGIN:$PUBLIC_APP_ORIGIN"
