name: Deploy Founding Friend Payment Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founding-friend-payment-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy payment Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cloudflare/founding-friend-payment-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Wrangler configuration
        run: npm run wrangler:validate

      - name: Validate production deployment configuration
        shell: bash
        env:
          PAYMENT_CREATION_ENABLED: ${{ vars.PAYMENT_CREATION_ENABLED || 'false' }}
          STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
          STRIPE_EXPECTED_LIVEMODE: ${{ vars.STRIPE_EXPECTED_LIVEMODE }}
          STRIPE_AUTOMATIC_TAX_ENABLED: ${{ vars.STRIPE_AUTOMATIC_TAX_ENABLED }}
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PURCHASE_REFERENCE_SECRET: ${{ secrets.PURCHASE_REFERENCE_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for variable_name in \
            STRIPE_PRICE_ID \
            STRIPE_EXPECTED_LIVEMODE \
            STRIPE_AUTOMATIC_TAX_ENABLED \
            PUBLIC_APP_ORIGIN \
            STRIPE_SECRET_KEY \
            PURCHASE_REFERENCE_SECRET \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required production Environment configuration: $variable_name"
              exit 1
            fi
          done

          case "$PAYMENT_CREATION_ENABLED" in
            true|false)
              ;;
            *)
              echo "::error::PAYMENT_CREATION_ENABLED must be true or false"
              exit 1
              ;;
          esac

          case "$STRIPE_EXPECTED_LIVEMODE" in
            true|false)
              ;;
            *)
              echo "::error::STRIPE_EXPECTED_LIVEMODE must be true or false"
              exit 1
              ;;
          esac

          case "$STRIPE_AUTOMATIC_TAX_ENABLED" in
            true|false)
              ;;
            *)
              echo "::error::STRIPE_AUTOMATIC_TAX_ENABLED must be true or false"
              exit 1
              ;;
          esac

      - name: Deploy payment Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/founding-friend-payment-worker
          packageManager: npm
          command: deploy
          vars: |
            PAYMENT_CREATION_ENABLED
            STRIPE_PRICE_ID
            STRIPE_EXPECTED_LIVEMODE
            STRIPE_AUTOMATIC_TAX_ENABLED
            PUBLIC_APP_ORIGIN
          secrets: |
            STRIPE_SECRET_KEY
            PURCHASE_REFERENCE_SECRET
        env:
          PAYMENT_CREATION_ENABLED: ${{ vars.PAYMENT_CREATION_ENABLED || 'false' }}
          STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
          STRIPE_EXPECTED_LIVEMODE: ${{ vars.STRIPE_EXPECTED_LIVEMODE }}
          STRIPE_AUTOMATIC_TAX_ENABLED: ${{ vars.STRIPE_AUTOMATIC_TAX_ENABLED }}
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PURCHASE_REFERENCE_SECRET: ${{ secrets.PURCHASE_REFERENCE_SECRET }}
