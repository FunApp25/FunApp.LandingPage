name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/venue-interest-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/venue-interest-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Worker bundle
        run: npm run wrangler:validate

      - name: Validate staging Worker bundle
        run: npm run wrangler:validate:staging

      - name: Test staging deployment safety and Wrangler upload metadata
        env:
          WORKER_PROJECT: venue-interest-worker
        run: node --test ../../test/tool/staging_deployment.test.mjs

  payment-worker:
    name: Payment Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/founding-friend-payment-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/founding-friend-payment-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Worker bundle
        run: npm run wrangler:validate

      - name: Validate staging Worker bundle
        run: npm run wrangler:validate:staging

      - name: Test staging deployment safety and Wrangler upload metadata
        env:
          WORKER_PROJECT: founding-friend-payment-worker
        run: node --test ../../test/tool/staging_deployment.test.mjs

  quality:
    name: Flutter and staging site checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: >-
          dart format
          --output=none
          --set-exit-if-changed
          lib test tool

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Dart sources
        run: flutter pub run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Enforce line coverage
        shell: bash
        run: |
          awk -F: -v threshold=90 '
            /^LF:/ { lines_found += $2 }
            /^LH:/ { lines_hit += $2 }
            END {
              if (lines_found == 0) {
                print "::error::No line coverage data found."
                exit 1
              }

              coverage = 100 * lines_hit / lines_found
              printf "Line coverage: %.2f%% (%d/%d)\n", coverage, lines_hit, lines_found

              if (coverage < threshold) {
                printf "::error::Line coverage %.2f%% is below %.0f%%.\n", coverage, threshold
                exit 1
              }
            }
          ' coverage/lcov.info

      - name: Build production site
        run: >-
          flutter build web
          -t lib/main_prod.dart

      - name: Prepare production artifact
        run: >-
          dart run
          tool/prepare_intermediate_release_artifact.dart

      - name: Build staging site
        run: >-
          flutter build web
          -t lib/main_staging.dart

      - name: Prepare staging artifact
        run: >-
          dart run
          tool/prepare_staging_release_artifact.dart

      - name: Set up Node.js for staging site Worker
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/staging-site-worker/package-lock.json

      - name: Install staging site Worker dependencies
        working-directory: cloudflare/staging-site-worker
        run: npm ci

      - name: Typecheck staging site Worker
        working-directory: cloudflare/staging-site-worker
        run: npm run typecheck

      - name: Test staging site Worker
        working-directory: cloudflare/staging-site-worker
        run: npm test

      - name: Validate staging Static Assets Worker bundle
        working-directory: cloudflare/staging-site-worker
        run: npm run wrangler:validate

      - name: Test staging deployment safety and Wrangler upload metadata
        env:
          WORKER_PROJECT: staging-site-worker
        run: node --test test/tool/staging_deployment.test.mjs

      - name: Verify staging artifact identity
        run: bash tool/verify_staging_artifact.sh

      - name: Upload validated staging artifact for dev deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v7
        with:
          name: staging-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 1
