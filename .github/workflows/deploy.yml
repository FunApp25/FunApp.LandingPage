name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PURO_ENV_NAME: fun-app-landing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Puro
        env:
          PURO_VERSION: 1.5.0
        run: curl -o- https://puro.dev/install.sh | bash

      - name: Add Puro to PATH
        run: echo "$HOME/.puro/bin" >> "$GITHUB_PATH"

      - name: Set up Flutter SDK with Puro
        run: |
          puro create "$PURO_ENV_NAME" stable
          puro --env="$PURO_ENV_NAME" --version
          puro --env="$PURO_ENV_NAME" flutter --version
          puro --env="$PURO_ENV_NAME" dart --version

      - name: Install dependencies
        run: puro --env="$PURO_ENV_NAME" flutter pub get

      - name: Generate localizations
        run: puro --env="$PURO_ENV_NAME" flutter gen-l10n

      - name: Analyze
        run: puro --env="$PURO_ENV_NAME" flutter analyze

      - name: Test
        run: puro --env="$PURO_ENV_NAME" flutter test

      - name: Build site
        run: puro --env="$PURO_ENV_NAME" flutter build web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
