name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      authorize_here_and_now_submissions:
        description: Authorize Here & Now submissions for this release
        type: boolean
        default: false
      authorize_founding_friend_submissions:
        description: Authorize Founding Friend submissions for this release
        type: boolean
        default: false
      authorize_payment_creation:
        description: Authorize live Checkout creation for this release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: funapp-production-deployment
  cancel-in-progress: false

jobs:
  checks:
    name: Validation
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/pr_checks.yml

  build:
    name: Build production Pages artifact
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build

      - name: Build site
        env:
          FUN_APP_VENUE_BOOKING_URL: ${{ vars.FUN_APP_VENUE_BOOKING_URL }}
        run: >-
          flutter build web --no-web-resources-cdn
          -t lib/main_prod.dart
          --dart-define="FUN_APP_VENUE_BOOKING_URL=$FUN_APP_VENUE_BOOKING_URL"

      - name: Prepare and verify production artifact
        run: |
          dart run tool/prepare_intermediate_release_artifact.dart
          dart run tool/verify_web_resources.dart

      - name: Upload Pages artifact for this run
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build/web

  workers:
    name: Deploy production registration and payment Workers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/staging-wrangler/package-lock.json

      - name: Install locked deployment tools
        run: npm ci --prefix tool/staging-wrangler

      - name: Preflight, upload, and deploy both existing production Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID }}
          HUBSPOT_VENUE_FORM_GUID: ${{ vars.HUBSPOT_VENUE_FORM_GUID }}
          HUBSPOT_FORM_GUID: ${{ vars.HUBSPOT_FORM_GUID }}
          HUBSPOT_HERE_AND_NOW_FORM_GUID: ${{ vars.HUBSPOT_HERE_AND_NOW_FORM_GUID }}
          HUBSPOT_FOUNDING_FRIEND_FORM_GUID: ${{ vars.HUBSPOT_FOUNDING_FRIEND_FORM_GUID }}
          HERE_AND_NOW_SUBMISSIONS_ENABLED: ${{ vars.HERE_AND_NOW_SUBMISSIONS_ENABLED }}
          FOUNDING_FRIEND_SUBMISSIONS_ENABLED: ${{ vars.FOUNDING_FRIEND_SUBMISSIONS_ENABLED }}
          PAYMENT_CREATION_ENABLED: ${{ vars.PAYMENT_CREATION_ENABLED }}
          AUTHORIZE_HERE_AND_NOW_SUBMISSIONS: ${{ inputs.authorize_here_and_now_submissions }}
          AUTHORIZE_FOUNDING_FRIEND_SUBMISSIONS: ${{ inputs.authorize_founding_friend_submissions }}
          AUTHORIZE_PAYMENT_CREATION: ${{ inputs.authorize_payment_creation }}
          STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
          STRIPE_EXPECTED_LIVEMODE: ${{ vars.STRIPE_EXPECTED_LIVEMODE }}
          STRIPE_AUTOMATIC_TAX_ENABLED: ${{ vars.STRIPE_AUTOMATIC_TAX_ENABLED }}
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PURCHASE_REFERENCE_SECRET: ${{ secrets.PURCHASE_REFERENCE_SECRET }}
        run: node tool/deploy_production_workers.mjs

  pages:
    name: Publish production Pages artifact
    needs: workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Require current main revision
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "$latest" != "$GITHUB_SHA"$'\trefs/heads/main' ]]; then
            echo 'Production revision has been superseded.'
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
