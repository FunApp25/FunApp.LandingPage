name: Deploy Venue Interest Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venue-interest-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cloudflare/venue-interest-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Wrangler configuration
        run: npm run wrangler:validate

      - name: Validate production deployment configuration
        shell: bash
        env:
          HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID }}
          HUBSPOT_FORM_GUID: ${{ vars.HUBSPOT_FORM_GUID }}
          HUBSPOT_HERE_AND_NOW_FORM_GUID: ${{ vars.HUBSPOT_HERE_AND_NOW_FORM_GUID }}
          HUBSPOT_FOUNDING_FRIEND_FORM_GUID: ${{ vars.HUBSPOT_FOUNDING_FRIEND_FORM_GUID }}
          REGISTRATION_SUBMISSIONS_ENABLED: ${{ vars.REGISTRATION_SUBMISSIONS_ENABLED || 'false' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for variable_name in \
            HUBSPOT_PORTAL_ID \
            HUBSPOT_FORM_GUID \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required production Environment configuration: $variable_name"
              exit 1
            fi
          done

          case "$REGISTRATION_SUBMISSIONS_ENABLED" in
            true)
              for variable_name in \
                HUBSPOT_HERE_AND_NOW_FORM_GUID \
                HUBSPOT_FOUNDING_FRIEND_FORM_GUID
              do
                if [[ -z "${!variable_name:-}" ]]; then
                  echo "::error::Registration activation requires: $variable_name"
                  exit 1
                fi
              done
              ;;
            false)
              ;;
            *)
              echo "::error::REGISTRATION_SUBMISSIONS_ENABLED must be true or false"
              exit 1
              ;;
          esac

      - name: Deploy existing Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/venue-interest-worker
          packageManager: npm
          command: deploy --env=""
          vars: |
            HUBSPOT_PORTAL_ID
            HUBSPOT_FORM_GUID
            REGISTRATION_SUBMISSIONS_ENABLED
            ${{ (vars.REGISTRATION_SUBMISSIONS_ENABLED || 'false') == 'true' && 'HUBSPOT_HERE_AND_NOW_FORM_GUID' || '' }}
            ${{ (vars.REGISTRATION_SUBMISSIONS_ENABLED || 'false') == 'true' && 'HUBSPOT_FOUNDING_FRIEND_FORM_GUID' || '' }}
        env:
          HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID }}
          HUBSPOT_FORM_GUID: ${{ vars.HUBSPOT_FORM_GUID }}
          HUBSPOT_HERE_AND_NOW_FORM_GUID: ${{ vars.HUBSPOT_HERE_AND_NOW_FORM_GUID }}
          HUBSPOT_FOUNDING_FRIEND_FORM_GUID: ${{ vars.HUBSPOT_FOUNDING_FRIEND_FORM_GUID }}
          REGISTRATION_SUBMISSIONS_ENABLED: ${{ vars.REGISTRATION_SUBMISSIONS_ENABLED || 'false' }}
