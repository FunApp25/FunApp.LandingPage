name: Deploy Venue Interest Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venue-interest-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cloudflare/venue-interest-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Wrangler configuration
        run: npm run wrangler:validate

      - name: Validate production deployment configuration
        shell: bash
        env:
          HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID }}
          HUBSPOT_FORM_GUID: ${{ vars.HUBSPOT_FORM_GUID }}
          HUBSPOT_HERE_AND_NOW_FORM_GUID: ${{ vars.HUBSPOT_HERE_AND_NOW_FORM_GUID }}
          HERE_AND_NOW_SUBMISSIONS_ENABLED: ${{ vars.HERE_AND_NOW_SUBMISSIONS_ENABLED || 'false' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for variable_name in \
            HUBSPOT_PORTAL_ID \
            HUBSPOT_FORM_GUID \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required production Environment configuration: $variable_name"
              exit 1
            fi
          done

          guid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [[ ! "$HUBSPOT_PORTAL_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::HUBSPOT_PORTAL_ID must be numeric"
            exit 1
          fi
          if [[ ! "$HUBSPOT_FORM_GUID" =~ $guid_pattern ]]; then
            echo "::error::HUBSPOT_FORM_GUID must be a valid HubSpot form GUID"
            exit 1
          fi

          case "$HERE_AND_NOW_SUBMISSIONS_ENABLED" in
            true)
              if [[ ! "${HUBSPOT_HERE_AND_NOW_FORM_GUID:-}" =~ $guid_pattern ]]; then
                echo "::error::Here & Now activation requires a valid HUBSPOT_HERE_AND_NOW_FORM_GUID"
                exit 1
              fi
              ;;
            false)
              ;;
            *)
              echo "::error::HERE_AND_NOW_SUBMISSIONS_ENABLED must be true or false"
              exit 1
              ;;
          esac

      - name: Deploy existing Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/venue-interest-worker
          packageManager: npm
          command: deploy --env=""
          vars: |
            HUBSPOT_PORTAL_ID
            HUBSPOT_FORM_GUID
            HERE_AND_NOW_SUBMISSIONS_ENABLED
            ${{ vars.HERE_AND_NOW_SUBMISSIONS_ENABLED == 'true' && 'HUBSPOT_HERE_AND_NOW_FORM_GUID' || '' }}
        env:
          HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID }}
          HUBSPOT_FORM_GUID: ${{ vars.HUBSPOT_FORM_GUID }}
          HUBSPOT_HERE_AND_NOW_FORM_GUID: ${{ vars.HUBSPOT_HERE_AND_NOW_FORM_GUID }}
          HERE_AND_NOW_SUBMISSIONS_ENABLED: ${{ vars.HERE_AND_NOW_SUBMISSIONS_ENABLED || 'false' }}
