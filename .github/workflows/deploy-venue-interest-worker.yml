name: Deploy Venue Interest Worker

on:
  workflow_dispatch:
    inputs:
      authorize_here_and_now_submissions:
        description: Authorize Here & Now submissions for this deployment
        type: boolean
        default: false
      authorize_founding_friend_submissions:
        description: Authorize Founding Friend submissions for this deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: venue-interest-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cloudflare/venue-interest-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Wrangler configuration
        run: npm run wrangler:validate

      - name: Preflight and deploy existing forms Worker
        shell: bash
        env:
          HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID }}
          HUBSPOT_FORM_GUID: ${{ vars.HUBSPOT_FORM_GUID }}
          HUBSPOT_HERE_AND_NOW_FORM_GUID: ${{ vars.HUBSPOT_HERE_AND_NOW_FORM_GUID }}
          HUBSPOT_FOUNDING_FRIEND_FORM_GUID: ${{ vars.HUBSPOT_FOUNDING_FRIEND_FORM_GUID }}
          HERE_AND_NOW_SUBMISSIONS_ENABLED: ${{ vars.HERE_AND_NOW_SUBMISSIONS_ENABLED || 'false' }}
          FOUNDING_FRIEND_SUBMISSIONS_ENABLED: ${{ vars.FOUNDING_FRIEND_SUBMISSIONS_ENABLED || 'false' }}
          AUTHORIZE_HERE_AND_NOW_SUBMISSIONS: ${{ inputs.authorize_here_and_now_submissions }}
          AUTHORIZE_FOUNDING_FRIEND_SUBMISSIONS: ${{ inputs.authorize_founding_friend_submissions }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node ../../tool/check_production_worker.mjs venue-interest-worker
          args=(
            --var "HUBSPOT_PORTAL_ID:$HUBSPOT_PORTAL_ID"
            --var "HUBSPOT_FORM_GUID:$HUBSPOT_FORM_GUID"
            --var "HERE_AND_NOW_SUBMISSIONS_ENABLED:$HERE_AND_NOW_SUBMISSIONS_ENABLED"
            --var "FOUNDING_FRIEND_SUBMISSIONS_ENABLED:$FOUNDING_FRIEND_SUBMISSIONS_ENABLED"
          )
          if [[ "$HERE_AND_NOW_SUBMISSIONS_ENABLED" == true ]]; then
            args+=(--var "HUBSPOT_HERE_AND_NOW_FORM_GUID:$HUBSPOT_HERE_AND_NOW_FORM_GUID")
          fi
          if [[ "$FOUNDING_FRIEND_SUBMISSIONS_ENABLED" == true ]]; then
            args+=(--var "HUBSPOT_FOUNDING_FRIEND_FORM_GUID:$HUBSPOT_FOUNDING_FRIEND_FORM_GUID")
          fi
          npx --no-install wrangler deploy --env="" --config wrangler.jsonc "${args[@]}"
